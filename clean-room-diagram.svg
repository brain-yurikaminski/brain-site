<svg xmlns="http://www.w3.org/2000/svg" class="clean-room-diagram" viewBox="0 0 400 90" fill="none">
  <!--
    Diagrama do Clean Data Room — extraído do site em 2026-09-09, não aplicado
    na página a pedido do usuário. Fica salvo aqui pra uso futuro (ex: deck,
    outra seção, ou reaplicação no site). Usa as CSS custom properties da marca
    (--stroke, --accent-data, --mid, --accent-synapse), então só renderiza as
    cores certas dentro de uma página que já define esses tokens no :root.
  -->
  <rect x="8" y="30" width="76" height="30" rx="0" stroke="var(--stroke)" stroke-width="1"/>
  <text x="46" y="49" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="11" fill="var(--mid)">Sua base</text>
  <rect x="316" y="30" width="76" height="30" rx="0" stroke="var(--stroke)" stroke-width="1"/>
  <text x="354" y="49" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="11" fill="var(--mid)">Base do parceiro</text>
  <rect x="140" y="14" width="120" height="62" rx="0" stroke="var(--accent-data)" stroke-width="1.5"/>
  <text x="200" y="33" text-anchor="middle" font-family="Roboto Mono, monospace" font-size="10" letter-spacing="1" fill="var(--accent-data)">CLEAN ROOM</text>
  <circle cx="200" cy="53" r="10" stroke="var(--accent-data)" stroke-width="1.5"/>
  <path d="M196 53l3 3 6-7" stroke="var(--accent-data)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="84" y1="45" x2="140" y2="45" stroke="var(--stroke)" stroke-width="1.5"/>
  <line x1="260" y1="45" x2="316" y2="45" stroke="var(--stroke)" stroke-width="1.5"/>
  <circle class="flow-dot" cx="84" cy="45" r="3" fill="var(--accent-synapse)"/>
  <circle class="flow-dot flow-dot-2" cx="316" cy="45" r="3" fill="var(--accent-synapse)"/>
</svg>
